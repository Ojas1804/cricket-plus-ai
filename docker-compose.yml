services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cricket
      POSTGRES_PASSWORD: cricket
      POSTGRES_DB: cricket
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    build: ./backend
    env_file: .env
    environment:
      LIVE_POLLER: worker
    ports: ["127.0.0.1:8000:8000"]
    volumes: [./data:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      migrate: {condition: service_completed_successfully}

  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    volumes: [./data:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      migrate: {condition: service_completed_successfully}

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    environment:
      VITE_API_BASE_URL: ""
      API_PROXY_TARGET: http://backend:8000
    depends_on: [backend]

volumes:
  pgdata:
